    <script>
        // ============================================================
        // AUTHENTICATION CHECK (Runs First)
        // ============================================================
        (async function checkAuth() {
            try {
                const response = await fetch('/api/auth/status');
                if (response.status === 401 || response.status === 403) {
                    // Not authenticated, redirect to login
                    window.location.href = '/login';
                    return;
                }
                
                const data = await response.json();
                if (!data.isAuthenticated) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('[Auth] Check failed:', error);
                // On error, try to redirect to login
                window.location.href = '/login';
            }
        })();

        // Global state
        let currentChannel = null;
        let videos = [];
        let selectedVideos = new Set();
        let currentFilteredVideos = []; // Store currently displayed (filtered) videos for Select All scope
        let pollingInterval = null;

        // API Base URL
        const API_BASE = '';

        // NEW: Download log system
        let downloadLog = [];
        let logIntervalId = null;

        // Show alert message
        function showAlert(message, type = 'info', duration = 5000) {
            const alert = document.getElementById('alert');
            alert.className = `alert show alert-${type}`;
            alert.innerHTML = message;
            
            setTimeout(() => {
                alert.classList.remove('show');
            }, duration);
        }

        // ==================== LOGGING SYSTEM ====================
        
        function addLogEntry(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = {
                time: timestamp,
                message: message,
                type: type
            };
            
            downloadLog.push(entry);
            
            if (downloadLog.length > 200) {
                downloadLog.shift();
            }
            
            renderLog();
            scrollToLogBottom();
            console.log(`[DownloadLog][${type.toUpperCase()}] ${message}`);
        }

        function renderLog() {
            const container = document.getElementById('logEntries');
            const countEl = document.getElementById('logCount');
            
            countEl.textContent = downloadLog.length;
            
            const newHtml = downloadLog.slice(-50).map(entry => `
                <div class="log-entry" data-time="${entry.time}">
                    <span class="log-time">${entry.time}</span>
                    <span class="log-${entry.type}">${escapeHtml(entry.message)}</span>
                </div>
            `).join('');
            
            if (container.innerHTML !== newHtml) {
                container.innerHTML = newHtml;
                
                // Scroll inner container to bottom (ONLY scroll now)
                container.scrollTop = container.scrollHeight;
            }
        }

        function scrollToLogBottom() {
            // Download Log: Scroll inner container only
            const downloadInner = document.getElementById('logEntries');
            if (downloadInner) {
                downloadInner.scrollTop = downloadInner.scrollHeight;
            }
            
            // Server Terminal: Scroll inner container only (if active)
            if (currentLogTab === 'server') {
                const serverInner = document.getElementById('serverLogEntries');
                if (serverInner) {
                    serverInner.scrollTop = serverInner.scrollHeight;
                }
            }
        }

        function toggleLogPanel() {
            const panel = document.getElementById('logPanel');
            panel.classList.toggle('collapsed');
        }

        // Log tab switching
        let currentLogTab = 'download';
        let serverLogInterval = null;
        let lastServerLogTime = null;

        function switchLogTab(tab) {
            currentLogTab = tab;
            
            document.getElementById('tabDownload').classList.toggle('active', tab === 'download');
            document.getElementById('tabServer').classList.toggle('active', tab === 'server');
            
            // Show/hide direct containers (no wrappers)
            document.getElementById('logEntries').style.display = tab === 'download' ? 'block' : 'none';
            document.getElementById('serverLogEntries').style.display = tab === 'server' ? 'block' : 'none';
            
            if (tab === 'server') {
                fetchServerLogs();
                startServerLogPolling();
            } else {
                stopServerLogPolling();
            }
        }

        async function fetchServerLogs() {
            try {
                const params = new URLSearchParams({
                    limit: '50',
                    since: lastServerLogTime || ''
                });
                
                const response = await fetch(`${API_BASE}/api/logs?${params}`);
                const data = await response.json();
                
                if (data.success) {
                    renderServerLogs(data.logs);
                    document.getElementById('serverLogCount').textContent = data.total;
                    
                    if (data.logs.length > 0) {
                        lastServerLogTime = data.logs[data.logs.length - 1].time;
                    }
                }
            } catch (error) {
                console.error('[Server Logs] Error fetching:', error);
            }
        }

        function renderServerLogs(logs) {
            const container = document.getElementById('serverLogEntries');
            
            if (!logs || logs.length === 0) {
                container.innerHTML = '<div class="log-entry"><span class="log-info">Waiting for server logs...</span></div>';
                return;
            }
            
            const newHtml = logs.map(log => {
                const time = new Date(log.time).toLocaleTimeString();
                return `
                    <div class="log-entry">
                        <span class="log-time">${time}</span>
                        <span class="log-${log.type}">${escapeHtml(log.message.substring(0, 200))}</span>
                    </div>
                `;
            }).join('');
            
            if (container.children.length <= 1 || container.innerHTML.includes('Waiting')) {
                container.innerHTML = newHtml;
            } else {
                container.insertAdjacentHTML('beforeend', newHtml);
            }
            
            // Scroll inner container to bottom (ONLY scroll now)
            const serverInner = document.getElementById('serverLogEntries');
            if (serverInner) {
                serverInner.scrollTop = serverInner.scrollHeight;
            }
        }

        function startServerLogPolling() {
            if (serverLogInterval) return;
            
            serverLogInterval = setInterval(() => {
                if (currentLogTab === 'server') {
                    fetchServerLogs();
                }
            }, 2000);
        }

        function stopServerLogPolling() {
            if (serverLogInterval) {
                clearInterval(serverLogInterval);
                serverLogInterval = null;
            }
        }

        function clearLogs() {
            if (currentLogTab === 'download') {
                downloadLog = [];
                renderLog();
                addLogEntry('🗑️ Download log cleared', 'info');
            } else {
                fetch(`${API_BASE}/api/logs`, { method: 'DELETE' })
                    .then(() => {
                        document.getElementById('serverLogEntries').innerHTML = 
                            '<div class="log-entry"><span class="log-info">🗑️ Server logs cleared</span></div>';
                        document.getElementById('serverLogCount').textContent = '0';
                        lastServerLogTime = null;
                    })
                    .catch(err => console.error('Error clearing logs:', err));
            }
        }

        // ==================== LOGOUT FUNCTION ====================
        
        async function handleLogout() {
            try {
                const response = await fetch('/api/logout', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/login';
            }
        }

        // ==================== CHANNEL LOADING ====================
        
        async function loadChannel() {
            const input = document.getElementById('channelInput');
            const url = input.value.trim();
            
            if (!url) {
                showAlert('Please enter a channel URL or username', 'warning');
                return;
            }

            const btn = document.getElementById('loadBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Loading...';

            showAlert('📡 Fetching channel information...', 'info');
            addLogEntry(`📡 Loading channel: ${url}`, 'info');

            try {
                const response = await fetch(`${API_BASE}/api/channels`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Failed to load channel');
                }

                currentChannel = data.channel;
                videos = currentChannel.videos || [];

                document.getElementById('videosCard').style.display = 'block';
                document.getElementById('channelInput').value = currentChannel.url || url;

                // Update stats
                document.getElementById('channelStats').innerHTML = `
                    <span class="stat-badge stat-total">📊 Total: ${videos.length}</span>
                `;

                renderVideos();

                showAlert(`✅ Loaded "${currentChannel.name}" with ${videos.length} videos`, 'success', 4000);
                addLogEntry(`✅ Channel loaded: ${currentChannel.name} (${videos.length} videos)`, 'success');

                // Start queue polling if there are active downloads
                startPolling();

            } catch (error) {
                console.error('[Load Channel] Error:', error);
                showAlert(`❌ Error: ${error.message}`, 'error', 6000);
                addLogEntry(`❌ Failed to load channel: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Load Channel';
            }
        }

        // ==================== VIDEO RENDERING ====================
        
        // Store sync data globally
        let syncData = null;
        let syncTimerInterval = null;
        let syncRefreshSeconds = 10 * 60; // Default: 10 minutes (can be changed by user)
        let syncInProgress = false; // ⭐ FIX: Prevent duplicate sync calls
        let lastSyncTime = 0; // Track last sync time
        
        // Current filter state: 'all', 'downloaded', or 'remaining'
        let currentSyncFilter = 'all';
        
        // Set sync filter and re-render videos
        function setSyncFilter(filter) {
            currentSyncFilter = filter;
            
            // Update button active states
            document.querySelectorAll('.sync-filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if (filter === 'all') {
                document.getElementById('btnFilterAll').classList.add('active');
            } else if (filter === 'downloaded') {
                document.getElementById('btnFilterDownloaded').classList.add('active');
            } else if (filter === 'remaining') {
                document.getElementById('btnFilterRemaining').classList.add('active');
            }
            
            // Re-render videos with new filter
            renderVideos();
        }
        
        function renderVideos() {
            const container = document.getElementById('videoList');
            
            if (videos.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 30px;">No videos found</p>';
                return;
            }

            // Sort videos: downloaded first, then new/undownloaded (if sync data exists)
            let sortedVideos = [...videos];
            let videoSyncStatus = {};
            
            if (syncData && syncData.videos) {
                // ==================== DEBUG LOGGING ====================
                console.log('🔍 [FILTER-DEBUG] renderVideos() called');
                console.log('🔍 [FILTER-DEBUG] currentSyncFilter:', currentSyncFilter);
                console.log('🔍 [FILTER-DEBUG] Total videos:', videos.length);
                console.log('🔍 [FILTER-DEBUG] syncData.videos length:', syncData.videos.length);
                
                // Create a map of video ID to sync status
                syncData.videos.forEach((sv, idx) => {
                    videoSyncStatus[sv.id || sv.title] = sv;
                    if (idx < 3) {  // Log first 3 for debugging
                        console.log(`🔍 [FILTER-DEBUG] syncData.videos[${idx}]:`, {
                            id: sv.id,
                            title: sv.title,
                            displayTitle: sv.displayTitle,
                            isDownloaded: sv.isDownloaded
                        });
                    }
                });
                
                console.log('🔍 [FILTER-DEBUG] videoSyncStatus keys (first 5):', Object.keys(videoSyncStatus).slice(0, 5));
                
                // Attach sync status to each video (with DEDUPLICATION)
                let matchCount = 0;
                let downloadedCount = 0;
                
                // Track which syncInfos have been consumed to prevent duplicates
                // This mirrors the server-side consumedFiles logic
                const consumedSyncEntries = new Set();
                
                sortedVideos.forEach((video, idx) => {
                    // FIX: Match by displayTitle directly (most reliable)
                    const syncInfo = syncData.videos.find(sv => 
                        (sv.displayTitle === video.displayTitle || sv.id === video.id) &&
                        !consumedSyncEntries.has(sv.displayTitle || sv.id)  // NOT YET CONSUMED
                    );
                    
                    // Use the syncInfo directly, don't create fallback unless needed
                    if (syncInfo) {
                        matchCount++;
                        // Mark this sync entry as CONSUMED so no other duplicate video can use it
                        consumedSyncEntries.add(syncInfo.displayTitle || syncInfo.id);
                        
                        video._syncStatus = syncInfo;
                        if (syncInfo.isDownloaded) downloadedCount++;
                    } else {
                        video._syncStatus = { isDownloaded: false };
                    }
                    
                    // Log first few videos AND any downloaded ones for debugging
                    if (idx < 3 || (syncInfo && syncInfo.isDownloaded)) {
                        console.log(`🔍 [FILTER-DEBUG] videos[${idx}]:`, {
                            id: video.id,
                            displayTitle: video.displayTitle,
                            foundSyncInfo: !!syncInfo,
                            isDownloaded: syncInfo ? syncInfo.isDownloaded : 'N/A',
                            fullSyncStatus: video._syncStatus
                        });
                    }
                });
                
                console.log('🔍 [FILTER-DEBUG] Matching results:');
                console.log('   - Videos with _syncStatus:', matchCount, '/', sortedVideos.length);
                console.log('   - Videos marked as downloaded:', downloadedCount);
                // ==================== END DEBUG ====================
                
                // ==================== VIDEO-LEVEL DEDUPLICATION ====================
                // Remove duplicate video entries (same video appearing multiple times in source)
                const seenVideoIds = new Set();
                const beforeDedup = sortedVideos.length;
                sortedVideos = sortedVideos.filter((video) => {
                    // Use displayTitle (or id) as unique key
                    const videoKey = video.displayTitle || video.id || video.title;
                    if (seenVideoIds.has(videoKey)) {
                        return false; // Duplicate - REMOVE IT
                    }
                    seenVideoIds.add(videoKey);
                    return true; // First occurrence - KEEP IT
                });
                console.log('🔍 [FILTER-DEBUG] Deduplication:', beforeDedup, '→', sortedVideos.length, '(removed', beforeDedup - sortedVideos.length, 'duplicates)');
                // ==================== END DEDUPLICATION ====================
                
                // APPLY FILTER based on currentSyncFilter
                const beforeFilter = sortedVideos.length;
                
                if (currentSyncFilter === 'downloaded') {
                    sortedVideos = sortedVideos.filter(v => v._syncStatus && v._syncStatus.isDownloaded);
                    console.log('🔍 [FILTER-DEBUG] Filter applied: DOWNLOADED');
                } else if (currentSyncFilter === 'remaining') {
                    sortedVideos = sortedVideos.filter(v => !v._syncStatus || !v._syncStatus.isDownloaded);
                    console.log('🔍 [FILTER-DEBUG] Filter applied: REMAINING');
                } else {
                    console.log('🔍 [FILTER-DEBUG] No filter applied (ALL)');
                }
                
                // ==================== ASCENDING ALPHABETICAL SORT (A-Z) ====================
                // Sort videos with SMART ORDERING:
                // - [All] button: Downloaded (A-Z) FIRST, then Remaining (A-Z)
                // - Other buttons: Pure A-Z within that filter
                const beforeSort = sortedVideos.length;
                
                if (currentSyncFilter === 'all') {
                    // [ALL] button: Downloaded files ON TOP, remaining BELOW, both A-Z
                    sortedVideos.sort((a, b) => {
                        const aDownloaded = a._syncStatus && a._syncStatus.isDownloaded ? 1 : 0;
                        const bDownloaded = b._syncStatus && b._syncStatus.isDownloaded ? 1 : 0;
                        
                        // Downloaded (1) comes before remaining (0)
                        if (bDownloaded !== aDownloaded) return bDownloaded - aDownloaded;
                        
                        // Within each group: A-Z ascending
                        const titleA = (a.displayTitle || a.title || '').toLowerCase();
                        const titleB = (b.displayTitle || b.title || '').toLowerCase();
                        return titleA.localeCompare(titleB);
                    });
                    console.log('🔍 [FILTER-DEBUG] Sorted', beforeSort, 'videos: Downloaded (A-Z) top, then Remaining (A-Z)');
                } else {
                    // [Downloaded] or [Remaining]: Pure A-Z ascending
                    sortedVideos.sort((a, b) => {
                        const titleA = (a.displayTitle || a.title || '').toLowerCase();
                        const titleB = (b.displayTitle || b.title || '').toLowerCase();
                        return titleA.localeCompare(titleB);
                    });
                    console.log('🔍 [FILTER-DEBUG] Sorted', beforeSort, 'videos in ascending order (A-Z)');
                }
                // ==================== END SORT ====================
                
                console.log('🔍 [FILTER-DEBUG] Videos after filter:', sortedVideos.length, '(was', beforeFilter, ')');
                // 'all' shows everything - no filter needed
            } else {
                console.log('⚠️ [FILTER-DEBUG] No syncData or syncData.videos!');
            }

            // Show filtered count message if filter is active and sync data exists
            let html = '';
            if (syncData && currentSyncFilter !== 'all') {
                const filterLabel = currentSyncFilter === 'downloaded' ? '✅ Downloaded Files' : '🔴 Remaining Files';
                html += `<div class="sync-section-header ${currentSyncFilter === 'downloaded' ? 'downloaded-section' : 'new-section'}" style="margin-bottom: 10px;">
                    ${filterLabel} - Showing ${sortedVideos.length} of ${videos.length} videos
                    <button onclick="setSyncFilter('all')" style="margin-left: 15px; padding: 4px 12px; font-size: 11px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">Show All</button>
                </div>`;
            }
            
            if (sortedVideos.length === 0) {
                const filterName = currentSyncFilter === 'downloaded' ? 'downloaded' : 'remaining';
                container.innerHTML = `<div style="text-align: center; color: #666; padding: 40px;">
                    <div style="font-size: 3em; margin-bottom: 10px;">${currentSyncFilter === 'downloaded' ? '✅' : '🔴'}</div>
                    <div style="font-size: 16px; font-weight: 600;">No ${filterName} files found</div>
                    <button onclick="setSyncFilter('all')" style="margin-top: 15px; padding: 8px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Show All Videos</button>
                </div>`;
                return;
            }
            
            let lastSyncStatus = null;
            
            sortedVideos.forEach((video, displayIndex) => {
                const originalIndex = videos.indexOf(video);
                const isSynced = syncData && video._syncStatus;
                const isDownloaded = isSynced && video._syncStatus.isDownloaded;
                const currentSyncStatus = isDownloaded ? 'downloaded' : (isSynced ? 'new' : null);
                
                // Add section header when status changes
                if (isSynced && currentSyncStatus !== lastSyncStatus) {
                    if (currentSyncStatus === 'downloaded') {
                        html += `<div class="sync-section-header downloaded-section">✅ Downloaded Files (${sortedVideos.filter(v => v._syncStatus && v._syncStatus.isDownloaded).length})</div>`;
                    } else if (currentSyncStatus === 'new') {
                        html += `<div class="sync-section-header new-section">🔴 New / Not Downloaded (${sortedVideos.filter(v => v._syncStatus && !v._syncStatus.isDownloaded).length})</div>`;
                    }
                    lastSyncStatus = currentSyncStatus;
                }
                
                // Determine status class
                const statusClass = video.downloadStatus === 'downloading' ? 'downloading' :
                                   video.downloadStatus === 'completed' ? 'completed' :
                                   video.downloadStatus === 'skipped' ? 'skipped' :
                                   video.downloadStatus === 'error' ? 'error' : '';
                
                // Sync status class
                const syncClass = isDownloaded ? 'sync-downloaded' : (isSynced ? 'sync-new' : '');
                
                // Generate file info HTML for downloaded videos
                const fileInfoHtml = (video.downloadStatus === 'completed' || video.downloadStatus === 'downloaded') && video.fileSize ? `
                    <div class="file-info">
                        <span class="file-info-icon">💾</span>
                        <div class="file-info-details">
                            <span class="file-info-item">📄 ${escapeHtml(video.filePath || 'File exists')}</span>
                            <span class="file-info-item">📦 ${video.fileSize} MB</span>
                        </div>
                    </div>
                ` : '';
                
                // Sync progress bar HTML - COMPACT INLINE
                const syncProgressHtml = isSynced ? `
                    <div class="sync-progress-container">
                        <span class="sync-progress-status ${isDownloaded ? 'sync-status-downloaded' : 'sync-status-new'}">
                            ${isDownloaded ? '✅ 100%' : '🔴 0%'}
                        </span>
                        ${isDownloaded && video._syncStatus.fileInfo ? `<span style="font-size: 10px; color: #2e7d32;">📦${video._syncStatus.fileInfo.fileSizeMB}MB</span>` : ''}
                    </div>
                ` : '';
                
                html += `
                <div class="video-item ${statusClass} ${syncClass}" data-index="${originalIndex}" id="video-${originalIndex}">
                    <input type="checkbox" 
                           class="video-checkbox" 
                           ${selectedVideos.has(originalIndex) ? 'checked' : ''}
                           onchange="toggleVideo(${originalIndex})">
                    
                    <div class="video-info">
                        <div class="video-title" title="${escapeHtml(video.displayTitle || video.title)}">${escapeHtml(video.displayTitle || video.title)}</div>
                        <div class="video-meta">
                            ${video.duration ? `<span>⏱️${formatDuration(video.duration)}</span>` : ''}
                            ${video.views && video.views !== 'NA' ? `<span>👁️${formatNumber(video.views)}</span>` : ''}
                        </div>
                    </div>

                    <!-- Sync Status (inline) -->
                    ${syncProgressHtml}

                    <!-- Action Buttons -->
                    <div class="video-actions">
                        ${video.downloadStatus === 'downloading' ? `
                            <span class="status-badge status-downloading">
                                <span class="spinner"></span>${Math.round(video.progress || 0)}%
                            </span>
                        ` : video.downloadStatus === 'completed' || video.downloadStatus === 'downloaded' ? `
                            <button class="btn-success btn-small" onclick="downloadFile('${video.id || ''}', '${(video.title || 'video').replace(/'/g, "\\'")}', '${video.filePath || video.finalFilename || video.downloadFilename || ''}')">📥</button>
                        ` : video.downloadStatus === 'skipped' ? `
                            <button class="btn-success btn-small" onclick="downloadFile('${video.id || ''}', '${(video.title || 'video').replace(/'/g, "\\'")}', '${video.filePath || video.downloadFilename || ''}')">📥</button>
                        ` : video.downloadStatus === 'error' ? `
                            <button class="btn-danger btn-small" onclick="downloadVideo(${originalIndex})">🔄</button>
                        ` : `
                            <button class="btn-primary btn-small" onclick="downloadVideo(${originalIndex})">⬇️</button>
                        `}
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
            
            // Store the filtered videos globally for filter-aware Select All
            currentFilteredVideos = sortedVideos;
            
            // Check for active downloads and start live sync
            if (videos.some(v => v.downloadStatus === 'downloading')) {
                startLiveProgressSync();
            }
        }

        function toggleVideo(index) {
            if (selectedVideos.has(index)) {
                selectedVideos.delete(index);
            } else {
                selectedVideos.add(index);
            }
            updateSelectedCount();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            
            // FIX: Use currentFilteredVideos (respects active filter) instead of all videos
            // This ensures Select All only selects videos visible in current filter
            const videosToToggle = currentFilteredVideos.length > 0 ? currentFilteredVideos : videos;
            
            videosToToggle.forEach((video) => {
                // Find the original index in the full videos array
                const originalIndex = videos.indexOf(video);
                if (originalIndex !== -1) {
                    if (selectAll.checked) {
                        selectedVideos.add(originalIndex);
                    } else {
                        selectedVideos.delete(originalIndex);
                    }
                }
            });
            renderVideos();
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const count = selectedVideos.size;
            const totalVisible = currentFilteredVideos.length > 0 ? currentFilteredVideos.length : videos.length;
            
            // Show contextual count: "X of Y selected" where Y = visible in current filter
            document.getElementById('selectedCount').textContent = 
                `${count} of ${totalVisible} selected`;
            document.getElementById('downloadSelectedBtn').disabled = count === 0;
        }

        // ==================== SYNC STATUS FUNCTIONS ====================
        
        async function syncDownloadStatus() {
            if (!currentChannel || !currentChannel.id) {
                showAlert('⚠️ Please load a channel first', 'warning', 3000);
                return;
            }
            
            const btn = document.getElementById('syncBtn');
            const btnIcon = document.getElementById('syncBtnIcon');
            const btnText = document.getElementById('syncBtnText');
            
            try {
                // ⭐ FIX: Check if sync already in progress (prevent double-click/rapid-fire)
                if (syncInProgress) {
                    console.log('[Sync] ⚠️ Sync already in progress, ignoring duplicate request');
                    showAlert('⏳ Sync already in progress...', 'warning', 2000);
                    return;
                }
                
                // ⭐ FIX: Enforce minimum 30 seconds between syncs
                const timeSinceLastSync = Date.now() - lastSyncTime;
                const MIN_SYNC_INTERVAL = 30000; // 30 seconds minimum
                if (timeSinceLastSync < MIN_SYNC_INTERVAL) {
                    const waitTime = Math.ceil((MIN_SYNC_INTERVAL - timeSinceLastSync) / 1000);
                    console.log(`[Sync] ⚠️ Too soon! Please wait ${waitTime} seconds`);
                    showAlert(`⏳ Please wait ${waitTime} seconds before syncing again`, 'warning', 2000);
                    return;
                }
                
                // Mark sync as in progress
                syncInProgress = true;
                lastSyncTime = Date.now();
                
                // Show loading state
                btn.disabled = true;
                btnIcon.innerHTML = '<span class="sync-spinner"></span>';
                btnText.textContent = 'Syncing...';
                
                addLogEntry('🔄 Checking download status...', 'info');
                
                // Call the sync API
                const response = await fetch(`${API_BASE}/api/channels/${currentChannel.id}/sync-status`);
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Sync failed');
                }
                
                // Store sync data globally
                syncData = result;
                
                // Update stats display
                document.getElementById('syncStatsBar').style.display = 'flex';
                document.getElementById('syncTotal').textContent = result.statistics.total;
                document.getElementById('syncDownloaded').textContent = result.statistics.downloaded;
                document.getElementById('syncRemaining').textContent = result.statistics.remaining;
                document.getElementById('syncPercentage').textContent = result.statistics.percentage;
                
                // Re-render videos with sync status
                renderVideos();
                
                // Show success message
                showAlert(`✅ Sync complete: ${result.statistics.downloaded}/${result.statistics.total} files found`, 'success', 4000);
                addLogEntry(`✅ Sync complete: ${result.statistics.downloaded} downloaded, ${result.statistics.remaining} remaining`, 'success');
                
                // Start auto-refresh timer
                startSyncTimer();
                
            } catch (error) {
                console.error('[Sync] Error:', error);
                showAlert(`❌ Sync failed: ${error.message}`, 'error', 5000);
                addLogEntry(`❌ Sync failed: ${error.message}`, 'error');
            } finally {
                // Reset button state
                btn.disabled = false;
                btnIcon.textContent = '🔄';
                btnText.textContent = 'Sync Status';
                
                // ⭐ FIX: Release sync lock
                syncInProgress = false;
                console.log('[Sync] 🔓 Sync lock released (frontend)');
            }
        }
        
        function startSyncTimer() {
            // Clear existing timer
            if (syncTimerInterval) {
                clearInterval(syncTimerInterval);
            }
            
            // Use user-configured refresh interval (default: 10 minutes)
            let remainingSeconds = syncRefreshSeconds;
            
            // Show timer
            document.getElementById('syncTimer').style.display = 'flex';
            updateSyncCountdown(remainingSeconds);
            
            // Update countdown every second
            syncTimerInterval = setInterval(() => {
                remainingSeconds--;
                
                if (remainingSeconds <= 0) {
                    // Time's up - auto refresh
                    clearInterval(syncTimerInterval);
                    syncTimerInterval = null;
                    addLogEntry('⏱️ Auto-sync triggered...', 'info');
                    syncDownloadStatus();
                } else {
                    updateSyncCountdown(remainingSeconds);
                }
            }, 1000);
        }
        
        function updateSyncCountdown(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('syncCountdown').textContent = 
                `${minutes}:${secs.toString().padStart(2, '0')}`;
        }
        
        function stopSyncTimer() {
            if (syncTimerInterval) {
                clearInterval(syncTimerInterval);
                syncTimerInterval = null;
            }
            document.getElementById('syncTimer').style.display = 'none';
        }

        // ==================== REFRESH INTERVAL CONTROL ====================
        
        // Change sync refresh interval from dropdown
        function changeSyncRefreshInterval(value) {
            const MIN_INTERVAL = 120; // ⭐ FIX: Minimum 2 minutes (120 seconds)
            
            if (value === '-1') {
                // Custom interval - show prompt
                const customMinutes = prompt(
                    'Enter custom refresh interval in minutes:\n' +
                    '(e.g., 3 for 3 minutes, 5 for 5 minutes)\n\n' +
                    '⭐ Minimum: 2 minutes (recommended: 5-10 min)\n' +
                    'Maximum: 1440 minutes (24 hours)',
                    '5'
                );
                
                if (customMinutes === null || customMinutes === '') {
                    // User cancelled - reset dropdown to current value
                    document.getElementById('syncRefreshInterval').value = syncRefreshSeconds;
                    return;
                }
                
                const minutes = parseFloat(customMinutes);
                
                // ⭐ FIX: Enforce minimum 2 minutes
                if (isNaN(minutes) || minutes < 2 || minutes > 1440) {
                    showAlert('⚠️ Please enter a value between 2 and 1440 minutes', 'warning', 3000);
                    document.getElementById('syncRefreshInterval').value = syncRefreshSeconds;
                    return;
                }
                
                // Set custom interval (convert to seconds)
                syncRefreshSeconds = Math.round(minutes * 60);
                
                // Add custom option to dropdown if not exists
                const select = document.getElementById('syncRefreshInterval');
                let customOption = select.querySelector('option[value="' + syncRefreshSeconds + '"]');
                if (!customOption) {
                    customOption = document.createElement('option');
                    customOption.value = syncRefreshSeconds;
                    customOption.textContent = minutes % 1 === 0 
                        ? `${minutes} min (custom)` 
                        : `${minutes} min (${Math.round(minutes * 60)}s) (custom)`;
                    select.appendChild(customOption);
                }
                select.value = syncRefreshSeconds;
                
            } else {
                // Predefined interval selected
                syncRefreshSeconds = parseInt(value);
            }
            
            // Restart timer with new interval
            if (syncTimerInterval || syncData) {
                startSyncTimer();
                addLogEntry(`⏱️ Refresh interval changed to ${formatSyncInterval(syncRefreshSeconds)}`, 'info');
                showAlert(`✅ Refresh interval: ${formatSyncInterval(syncRefreshSeconds)}`, 'success', 2500);
            }
            
            // Save preference to localStorage
            localStorage.setItem('ytl_sync_refresh_seconds', syncRefreshSeconds);
        }
        
        // Format seconds to human-readable string
        function formatSyncInterval(seconds) {
            if (seconds < 60) return `${seconds} seconds`;
            if (seconds === 60) return '1 minute';
            if (seconds < 3600) return `${seconds / 60} minutes`;
            if (seconds === 3600) return '1 hour';
            return `${seconds / 3600} hours`;
        }
        
        // Load saved refresh interval on page load
        function loadSavedSyncInterval() {
            const saved = localStorage.getItem('ytl_sync_refresh_seconds');
            if (saved) {
                syncRefreshSeconds = parseInt(saved);
                const select = document.getElementById('syncRefreshInterval');
                if (select && select.querySelector(`option[value="${saved}"]`)) {
                    select.value = saved;
                }
            }
        }
        
        // ==================== END REFRESH INTERVAL CONTROL ====================

        // ==================== DOWNLOAD FUNCTIONS ====================
        
        async function downloadVideo(index) {
            const video = videos[index];
            
            video.downloadStatus = 'downloading';
            video.progress = 0;
            
            addLogEntry(`▶️ Starting download: "${(video.displayTitle || video.title).substring(0, 40)}..."`, 'info');
            renderVideos();

            try {
                const response = await fetch(`${API_BASE}/api/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        videoId: video.id || video.videoId,
                        title: video.displayTitle || video.title,
                        filename: video.downloadFilename || null,  // ⭐ NEW: Pass downloadFilename for duplicates
                        channelId: currentChannel?.id,
                        channelName: currentChannel?.name,
                        format: 'best',
                        quality: 'lowest'
                    })
                });

                const result = await response.json();

                if (result.status === 'skipped') {
                    video.downloadStatus = 'skipped';
                    video.fileSize = result.download?.sizeMB;
                    video.filePath = result.download?.filename;
                    showAlert(`${(video.displayTitle || video.title).substring(0, 50)}... - Already exists!`, 'warning');
                    addLogEntry(`⏭️ Skipped (exists): "${(video.displayTitle || video.title).substring(0, 30)}..."`, 'warning');
                } else if (result.success) {
                    video.jobId = result.jobId;
                    showAlert(`Started: ${(video.displayTitle || video.title).substring(0, 50)}...`, 'info');
                    addLogEntry(`✅ Download queued: "${(video.displayTitle || video.title).substring(0, 30)}..." [Job: ${result.jobId}]`, 'success');
                    startLiveProgressSync();
                } else {
                    throw new Error(result.error || 'Download failed');
                }

                renderVideos();

            } catch (error) {
                video.downloadStatus = 'error';
                video.error = error.message;
                renderVideos();
                showAlert(`Error: ${error.message}`, 'error');
                addLogEntry(`❌ Download failed: "${(video.displayTitle || video.title).substring(0, 30)}..." - ${error.message}`, 'error');
            }
        }
        
        // ==================== LIVE PROGRESS SYNC ====================
        let progressSyncInterval = null;
        
        function startLiveProgressSync() {
            if (progressSyncInterval) {
                showLiveIndicator(true);
                return;
            }
            
            console.log('[Progress] Starting live sync with backend...');
            addLogEntry('🔄 Starting real-time progress sync...', 'info');
            showLiveIndicator(true);
            
            progressSyncInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/download-queue`);
                    const data = await response.json();
                    
                    if (!data.success) return;
                    
                    let hasActiveDownloads = false;
                    let completedThisTick = [];
                    
                    videos.forEach((video, index) => {
                        const activeDownload = data.queue.active.find(d => 
                            d.videoId === video.id || d.title === video.title || d.url?.includes(video.id)
                        );
                        const completedDownload = data.queue.completed.find(d => 
                            d.videoId === video.id || d.title === video.title || d.url?.includes(video.id)
                        );
                        
                        if (activeDownload) {
                            hasActiveDownloads = true;
                            
                            const backendProgress = activeDownload.progress || 0;
                            const oldProgress = video.progress || 0;
                            
                            if (Math.abs(oldProgress - backendProgress) >= 0.5) {
                                video.progress = backendProgress;
                                video.speed = activeDownload.speed || null;
                                video.total = activeDownload.total || null;
                                
                                updateProgressBar(index, backendProgress, activeDownload.speed, activeDownload.total);
                                progressUpdated = true;
                            }
                            
                            if (video.downloadStatus !== 'downloading') {
                                video.downloadStatus = 'downloading';
                            }
                        }
                        
                        if (completedDownload && video.downloadStatus !== 'completed' && video.downloadStatus !== 'downloaded') {
                            video.downloadStatus = 'completed';
                            video.progress = 100;
                            video.finalFilename = completedDownload.finalFilename || null;
                            video.renamedFrom = completedDownload.renamedFrom || null;
                            video.fileSize = completedDownload.sizeMB || video.fileSize;
                            
                            completedThisTick.push({
                                index,
                                title: video.title,
                                finalFilename: video.finalFilename
                            });
                        }
                    });
                    
                    if (completedThisTick.length > 0) {
                        completedThisTick.forEach(({index, title, finalFilename}) => {
                            showCompletionNotification(index, title, finalFilename);
                            addLogEntry(`✅ Download complete: "${title.substring(0, 35)}..." -> ${finalFilename || 'saved'}`, 'success');
                        });
                        
                        renderVideos();
                    }
                    
                    if (!hasActiveDownloads && completedThisTick.length === 0) {
                        const stillDownloading = videos.some(v => v.downloadStatus === 'downloading');
                        if (!stillDownloading) {
                            stopLiveProgressSync();
                        }
                    }
                    
                } catch (error) {
                    console.warn('[Progress] Sync error:', error);
                }
            }, 2000);
        }
        
        function stopLiveProgressSync() {
            if (progressSyncInterval) {
                clearInterval(progressSyncInterval);
                progressSyncInterval = null;
                console.log('[Progress] Stopped live sync');
                showLiveIndicator(false);
                addLogEntry('⏹️ Real-time progress sync stopped', 'info');
            }
        }
        
        function showLiveIndicator(show) {
            const indicator = document.getElementById('liveIndicator');
            indicator.style.display = show ? 'inline-flex' : 'none';
        }
        
        function updateProgressBar(index, progress, speed, size) {
            const fillEl = document.getElementById(`progress-fill-${index}`);
            const percentEl = document.getElementById(`progress-percent-${index}`);
            const speedEl = document.getElementById(`progress-speed-${index}`);
            const sizeEl = document.getElementById(`progress-size-${index}`);
            const containerEl = document.getElementById(`progress-container-${index}`);
            
            if (containerEl) containerEl.style.display = '';
            
            const clampedProgress = Math.max(0, Math.min(100, progress || 0));
            
            if (fillEl) {
                fillEl.style.width = `${clampedProgress}%`;
                if (clampedProgress >= 100) {
                    fillEl.classList.add('complete');
                    fillEl.classList.remove('active');
                } else {
                    fillEl.classList.remove('complete');
                    fillEl.classList.add('active');
                }
            }
            
            if (percentEl) {
                percentEl.textContent = clampedProgress >= 100 ? '✅ Complete!' : `${Math.round(clampedProgress)}%`;
            }
            
            if (speedEl) {
                speedEl.textContent = speed ? `🚀 ${speed}` : '';
            }
            
            if (sizeEl) {
                sizeEl.textContent = size ? `📦 ${size}` : '';
            }
        }
        
        function showCompletionNotification(index, title, finalFilename) {
            const message = finalFilename 
                ? `✅ Complete: "${title.substring(0, 40)}..."<br>📄 Saved as: ${finalFilename}`
                : `✅ Complete: "${title.substring(0, 40)}..."`;
            
            showAlert(message, 'success', 8000);
            
            const filenameEl = document.getElementById(`filename-${index}`);
            if (filenameEl && finalFilename) {
                filenameEl.style.display = '';
                filenameEl.innerHTML = `📄 ${escapeHtml(finalFilename)}`;
            }
            
            // Play completion sound
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (e) {}
        }

        async function downloadFile(videoId, title, filePath) {
            try {
                showAlert(`Preparing: ${title.substring(0, 40)}...`, 'info');
                
                let downloadUrl;
                
                if (filePath) {
                    const filename = filePath.split(/[/\\]/).pop();
                    downloadUrl = `/api/download-file/${encodeURIComponent(filename)}`;
                } else if (videoId) {
                    downloadUrl = `/api/download-file/${videoId}`;
                } else {
                    throw new Error('No file information available');
                }
                
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = title.replace(/[^a-zA-Z0-9._-]/g, '_') + '.mp4';
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                
                setTimeout(() => {
                    document.body.removeChild(link);
                }, 100);
                
                showAlert(`Downloading: ${title.substring(0, 40)}...`, 'success');
                addLogEntry(`📥 File download triggered: "${title.substring(0, 30)}..."`, 'success');
                
            } catch (error) {
                console.error('[Download File] Error:', error);
                showAlert(`Error: ${error.message}`, 'error');
                addLogEntry(`❌ File download error: ${error.message}`, 'error');
                window.open('/api/files', '_blank');
            }
        }

        async function downloadSelected() {
            if (selectedVideos.size === 0) {
                showAlert('No videos selected', 'warning');
                return;
            }

            const selectedIndices = Array.from(selectedVideos);
            let successCount = 0;

            addLogEntry(`📦 Starting batch download: ${selectedIndices.length} videos`, 'info');

            for (const index of selectedIndices) {
                const video = videos[index];
                
                if (video.downloadStatus === 'completed' || video.downloadStatus === 'downloaded') {
                    continue;
                }

                await downloadVideo(index);
                successCount++;
                await new Promise(resolve => setTimeout(resolve, 300));
            }

            showAlert(`Started ${successCount} downloads`, 'success');
            addLogEntry(`📊 Batch complete: ${successCount} downloads started`, 'success');

            selectedVideos.clear();
            updateSelectedCount();
        }

        async function downloadAll() {
            selectedVideos.clear();
            videos.forEach((video, index) => {
                if (video.downloadStatus !== 'completed' && video.downloadStatus !== 'downloaded' && 
                    video.downloadStatus !== 'skipped' && video.downloadStatus !== 'downloading') {
                    selectedVideos.add(index);
                }
            });

            renderVideos();
            updateSelectedCount();

            if (selectedVideos.size > 0) {
                await downloadSelected();
            } else {
                showAlert('All videos already downloaded!', 'info', 5000);
            }
        }

        function startPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }

            pollingInterval = setInterval(async () => {
                await refreshQueue();
            }, 3000);
        }

        async function refreshQueue() {
            try {
                // ⭐ Use NEW queue status endpoint (shows active/waiting/slots)
                const response = await fetch(`${API_BASE}/api/download/queue/status`);
                const data = await response.json();

                if (data.success) {
                    // Update stats display
                    document.getElementById('activeCount').textContent = data.queue.active || 0;
                    document.getElementById('waitingCount').textContent = data.queue.queued || 0;
                    
                    // Render queue items
                    renderQueue(data);
                    
                    // Show/hide queue card based on activity
                    const hasActivity = (data.queue.active > 0) || (data.queue.queued > 0) || 
                                       (data.activeDownloads && data.activeDownloads.length > 0);
                    document.getElementById('queueCard').style.display = hasActivity ? 'block' : 'none';
                }
            } catch (error) {
                console.error('Error refreshing queue:', error);
            }
        }

        function renderQueue(data) {
            const container = document.getElementById('queueList');
            
            // Combine active downloads and waiting queue
            const activeItems = (data.activeDownloads || []).map((item, idx) => ({
                ...item,
                status: 'downloading',
                position: `🟢 #${idx + 1}`,
                isWaiting: false
            }));
            
            const waitingItems = (data.queue?.queue || []).map((item, idx) => ({
                ...item,
                status: 'waiting',
                position: `⏳ #${idx + 1}`,
                isWaiting: true
            }));
            
            // ⭐ DEDUPLICATION FIX (Option B)
            // Remove waiting items that already appear in active list (by ID or title)
            const activeIds = new Set(activeItems.map(item => item.id || item.videoId || item.title));
            const uniqueWaitingItems = waitingItems.filter(item => {
                const itemId = item.id || item.videoId || item.title;
                return !activeIds.has(itemId);
            });
            
            // Combine: Active first, then unique waiting items
            const allItems = [...activeItems, ...uniqueWaitingItems];

            if (allItems.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 15px;">No downloads in queue</p>';
                return;
            }

            // ⭐ Single-line queue items with status - renumber positions after dedup
            let activeIdx = 0;
            let waitingIdx = 0;
            
            container.innerHTML = allItems.map(item => {
                // Renumber positions based on actual display order
                if (!item.isWaiting) {
                    item.position = `🟢 #${++activeIdx}`;
                } else {
                    item.position = `⏳ #${++waitingIdx}`;
                }
                
                return `
                <div class="queue-item ${item.isWaiting ? 'waiting' : 'downloading'}" id="queue-${item.id || item.downloadId}">
                    <div class="queue-item-info">
                        <span class="queue-position">${item.position}</span>
                        <span class="queue-item-title" title="${escapeHtml(item.title || item.id || 'Download')}">${escapeHtml(item.title || item.id || 'Download')}</span>
                    </div>
                    <div class="queue-item-status">
                        ${item.isWaiting 
                            ? `<span class="status-badge queue-waiting">⏳ Waiting</span>`
                            : `<span class="status-badge queue-active">▶️ ${item.progress || 0}%</span>`
                        }
                        ${item.speed && !item.isWaiting ? `<span style="color:#666">@${item.speed}</span>` : ''}
                        
                        <!-- 4 Action Buttons: Stop | Cancel | Remove | Force Stop -->
                        <div class="queue-actions">
                            <!-- STOP: Pause/Resume (Blue) -->
                            <button class="queue-btn queue-btn-stop" 
                                    onclick="event.stopPropagation(); stopQueueItem('${item.id || item.downloadId}', '${escapeHtml(item.title || 'Download')}')"
                                    title="Stop/Pause Download">
                                ⏸️
                            </button>
                            
                            <!-- CANCEL: Cancel with confirmation (Red) -->
                            <button class="queue-btn queue-btn-cancel" 
                                    onclick="event.stopPropagation(); showCancelConfirm('${item.id || item.downloadId}', '${escapeHtml(item.title || 'Download')}', 'cancel')"
                                    title="Cancel Download">
                                ❌
                            </button>
                            
                            <!-- REMOVE: Remove from queue (Gray) - Only for waiting -->
                            ${item.isWaiting ? `
                            <button class="queue-btn queue-btn-remove" 
                                    onclick="event.stopPropagation(); removeQueueItem('${item.id || item.downloadId}', '${escapeHtml(item.title || 'Download')}')"
                                    title="Remove from Queue">
                                🗑️
                            </button>
                            ` : ''}
                            
                            <!-- FORCE STOP: Kill process immediately (Dark Red) - Only for active -->
                            ${!item.isWaiting ? `
                            <button class="queue-btn queue-btn-force" 
                                    onclick="event.stopPropagation(); showCancelConfirm('${item.id || item.downloadId}', '${escapeHtml(item.title || 'Download')}', 'force')"
                                    title="Force Stop (Kill Process)">
                                ⛔
                            </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }
        
        // Clear only waiting downloads (not active ones)
        async function clearWaitingQueue() {

                const data = await response.json();

            fetch(`${API_BASE}/api/download-queue`, { method: 'DELETE' })
                .then(() => {
                    showAlert('Queue cleared', 'info');
                    addLogEntry('🗑️ Queue cleared by user', 'info');

        // ==================== QUEUE ACTION FUNCTIONS (4 Buttons) ====================
        
        // Store pending action for confirmation modal
        let pendingQueueAction = null;

        // SHOW CONFIRMATION MODAL (for Cancel & Force Stop)
        function showCancelConfirm(downloadId, title, actionType) {
            const isForce = actionType === 'force';
            const actionName = isForce ? 'Force Stop' : 'Cancel';
            const icon = isForce ? '⛔' : '❌';
            const message = isForce 
                ? `Are you sure you want to <strong>FORCE STOP</strong> this download?<br><br>
                   <span style="color:#c62828">⚠️ This will immediately kill the download process!</span><br>
                   The partial file may be corrupted.`
                : `Are you sure you want to <strong>cancel</strong> this download?<br><br>
                   "<em>${escapeHtml(title)}</em>"<br>
                   This action cannot be undone.`;
            
            pendingQueueAction = { downloadId, title, actionType };
            
            // Create modal
            const modalHtml = `
                <div class="confirm-modal-overlay" id="confirmModal" onclick="closeConfirmModal(event)">
                    <div class="confirm-modal" onclick="event.stopPropagation()">
                        <div class="confirm-modal-title">
                            ${icon} Confirm ${actionName}
                        </div>
                        <div class="confirm-modal-message">
                            ${message}
                        </div>
                        <div class="confirm-modal-actions">
                            <button class="confirm-modal-btn confirm-modal-btn-cancel-action" 
                                    onclick="closeConfirmModal()">
                                No, Keep It
                            </button>
                            <button class="confirm-modal-btn confirm-modal-btn-confirm" 
                                    onclick="executeConfirmedAction()">
                                ✅ Yes, ${actionName}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Append to body
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        // Close confirmation modal
        function closeConfirmModal(event) {
            if (event && event.target !== event.currentTarget) return;
            const modal = document.getElementById('confirmModal');
            if (modal) modal.remove();
            pendingQueueAction = null;
        }

        // Execute the confirmed action (Cancel or Force Stop)
        async function executeConfirmedAction() {
            if (!pendingQueueAction) return;
            
            const { downloadId, title, actionType } = pendingQueueAction;
            closeConfirmModal();
            
            if (actionType === 'force') {
                await forceStopQueueItem(downloadId, title);
            } else {
                await cancelQueueItem(downloadId, title);
            }
        }

        // ACTION 1: STOP / PAUSE (Blue button)
        async function stopQueueItem(downloadId, title) {
            try {
                console.log(`[Queue] ⏸️ Stopping: ${title} (${downloadId})`);
                
                // Call server to pause/stop the download
                const response = await fetch(`${API_BASE}/api/download/${downloadId}/stop`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'pause' })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert(`⏸️ Paused: ${title}`, 'info', 3000);
                    addLogEntry(`⏸️ Download paused: ${title}`, 'info');
                } else {
                    showAlert(`⚠️ Stop failed: ${result.error}`, 'warning', 4000);
                }
                
                refreshQueue();
            } catch (error) {
                console.error('[Queue] Error stopping download:', error);
                showAlert(`❌ Error stopping: ${error.message}`, 'error', 4000);
            }
        }

        // ACTION 2: CANCEL (Red button - with confirmation)
        async function cancelQueueItem(downloadId, title) {
            try {
                console.log(`[Queue] ❌ Cancelling: ${title} (${downloadId})`);
                
                // Show loading state on the item
                const itemEl = document.getElementById(`queue-${downloadId}`);
                if (itemEl) itemEl.style.opacity = '0.5';
                
                const response = await fetch(`${API_BASE}/api/download/${downloadId}/cancel`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason: 'user_cancelled' })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert(`❌ Cancelled: ${title}`, 'warning', 3000);
                    addLogEntry(`❌ Download cancelled by user: ${title}`, 'warning');
                } else {
                    showAlert(`⚠️ Cancel failed: ${result.error}`, 'warning', 4000);
                    if (itemEl) itemEl.style.opacity = '1';
                }
                
                refreshQueue();
            } catch (error) {
                console.error('[Queue] Error cancelling download:', error);
                showAlert(`❌ Error cancelling: ${error.message}`, 'error', 4000);
            }
        }

        // ACTION 3: REMOVE FROM QUEUE (Gray button - no confirmation)
        async function removeQueueItem(downloadId, title) {
            try {
                console.log(`[Queue] 🗑️ Removing from queue: ${title} (${downloadId})`);
                
                const response = await fetch(`${API_BASE}/api/download/${downloadId}/remove`, { 
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert(`🗑️ Removed: ${title}`, 'info', 2500);
                    addLogEntry(`🗑️ Removed from queue: ${title}`, 'info');
                    
                    // Animate removal
                    const itemEl = document.getElementById(`queue-${downloadId}`);
                    if (itemEl) {
                        itemEl.style.transition = 'all 0.3s ease';
                        itemEl.style.transform = 'translateX(100%)';
                        itemEl.style.opacity = '0';
                        setTimeout(() => refreshQueue(), 300);
                    } else {
                        refreshQueue();
                    }
                } else {
                    showAlert(`⚠️ Remove failed: ${result.error}`, 'warning', 4000);
                }
            } catch (error) {
                console.error('[Queue] Error removing from queue:', error);
                showAlert(`❌ Error removing: ${error.message}`, 'error', 4000);
            }
        }

        // ACTION 4: FORCE STOP (Dark Red button - with confirmation)
        async function forceStopQueueItem(downloadId, title) {
            try {
                console.log(`[Queue] ⛔ Force stopping: ${title} (${downloadId})`);
                
                // Show loading state
                const itemEl = document.getElementById(`queue-${downloadId}`);

                const result = await response.json();
                
                if (result.success) {

                    addLogEntry(`⛽ FORCE STOPPED by user: ${title} (process killed)`, 'error');
                } else {
                    showAlert(`⚠️ Force stop failed: ${result.error}`, 'warning', 4000);

                refreshQueue();

                console.error('[Queue] Error force stopping:', error);
                showAlert(`❌ Error force stopping: ${error.message}`, 'error', 4000);
            }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDuration(seconds) {
            if (!seconds || seconds === 'NA') return '';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function formatNumber(num) {
            if (!num || num === 'NA') return '';
            num = parseInt(num);
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            loadSavedSyncInterval(); // Load saved refresh interval
            addLogEntry('🌐 Application initialized', 'info');
        });

        // Handle Enter key
        document.getElementById('channelInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadChannel();
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopLiveProgressSync();
            if (pollingInterval) clearInterval(pollingInterval);
            stopServerLogPolling();
        });
    </script>
</body>
</html>
